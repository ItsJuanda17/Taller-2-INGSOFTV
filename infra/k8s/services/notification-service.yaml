apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: circleguard
  labels: { app: notification-service, tier: backend }
spec:
  replicas: 1
  selector:
    matchLabels: { app: notification-service }
  template:
    metadata:
      labels: { app: notification-service }
    spec:
      enableServiceLinks: false
      containers:
        - name: notification-service
          image: circleguard-notification-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          env:
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            # SMTP isn't deployed in dev; the listener still tries to send,
            # but failures are logged rather than re-throwing in DEV.
            - name: SPRING_MAIL_HOST
              value: "smtp.disabled"
            - name: AUTH_API_URL
              valueFrom: { configMapKeyRef: { name: circleguard-config, key: AUTH_API_URL } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: circleguard-secrets, key: JWT_SIGNING_KEY } }
            - name: QR_SECRET
              value: "my-qr-secret-key-for-dev-1234567890"
          readinessProbe:
            tcpSocket: { port: 8082 }
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            tcpSocket: { port: 8082 }
            initialDelaySeconds: 90
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: circleguard
spec:
  type: NodePort   # see auth-service.yaml for rationale
  selector: { app: notification-service }
  ports:
    - { name: http, port: 8082, targetPort: 8082, nodePort: 30082 }
