apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  namespace: circleguard
  labels: { app: identity-service, tier: backend }
spec:
  replicas: 1
  selector:
    matchLabels: { app: identity-service }
  template:
    metadata:
      labels: { app: identity-service }
    spec:
      enableServiceLinks: false
      containers:
        - name: identity-service
          image: circleguard-identity-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres:5432/circleguard_identity"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom: { secretKeyRef: { name: circleguard-secrets, key: POSTGRES_USER } }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: { secretKeyRef: { name: circleguard-secrets, key: POSTGRES_PASSWORD } }
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            # Vault config — must match between dev/stage/prod or existing
            # encrypted rows become unreadable. Stored as opaque secret keys
            # (we'd swap to KMS in a real prod cluster).
            - name: VAULT_SECRET
              value: "746573742d7365637265742d33322d63686172732d6c6f6e672d313233343536"
            - name: VAULT_SALT
              value: "deadbeef"
            - name: VAULT_HASH_SALT
              value: "12345678"
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: circleguard-secrets, key: JWT_SIGNING_KEY } }
          readinessProbe:
            tcpSocket: { port: 8083 }
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            tcpSocket: { port: 8083 }
            initialDelaySeconds: 90
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: identity-service
  namespace: circleguard
spec:
  type: NodePort   # see auth-service.yaml for rationale
  selector: { app: identity-service }
  ports:
    - { name: http, port: 8083, targetPort: 8083, nodePort: 30083 }
