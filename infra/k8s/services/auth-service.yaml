# =============================================================================
# Deployment + Service for circleguard-auth-service (DEV)
# -----------------------------------------------------------------------------
# Image: circleguard-auth-service:dev (built locally by the Jenkins pipeline,
# never pulled from a registry; imagePullPolicy: IfNotPresent + sharing the
# Docker Desktop daemon means K8s finds it on disk).
# Each pipeline run patches the deployment with a unique tag (dev-<build #>)
# so kubectl rolls out a fresh pod every time.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: circleguard
  labels:
    app: auth-service
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels: { app: auth-service }
  template:
    metadata:
      labels: { app: auth-service }
    spec:
      enableServiceLinks: false
      containers:
        - name: auth-service
          image: circleguard-auth-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8180
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres:5432/circleguard_auth"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom: { secretKeyRef: { name: circleguard-secrets, key: POSTGRES_USER } }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: { secretKeyRef: { name: circleguard-secrets, key: POSTGRES_PASSWORD } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: circleguard-secrets, key: JWT_SIGNING_KEY } }
            - name: CIRCLEGUARD_IDENTITY_SERVICE_URL
              valueFrom: { configMapKeyRef: { name: circleguard-config, key: CIRCLEGUARD_IDENTITY_SERVICE_URL } }
            # LDAP isn't deployed in this dev cluster; pointing it at a
            # non-existent host so the dependency wires but isn't required at
            # boot. The login endpoint will fail until LDAP is provided.
            - name: SPRING_LDAP_URLS
              value: "ldap://openldap:389"
          readinessProbe:
            tcpSocket: { port: 8180 }
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            tcpSocket: { port: 8180 }
            initialDelaySeconds: 90
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: circleguard
spec:
  type: NodePort   # exposed at host.docker.internal:30180 for the
                   # orchestrator pipeline's E2E + Locust stages, which
                   # run inside the Jenkins container (not a K8s pod).
  selector: { app: auth-service }
  ports:
    - { name: http, port: 8180, targetPort: 8180, nodePort: 30180 }
