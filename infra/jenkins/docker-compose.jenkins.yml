# =============================================================================
# CircleGuard - Jenkins controller (local DEV)
# -----------------------------------------------------------------------------
# Usage (from repo root):
#   docker compose -f infra/jenkins/docker-compose.jenkins.yml up -d --build
#   docker compose -f infra/jenkins/docker-compose.jenkins.yml logs -f jenkins
#
# After first boot:
#   1. Open http://localhost:8080
#   2. Read the initial admin password from the volume:
#        docker exec circleguard-jenkins cat /var/jenkins_home/secrets/initialAdminPassword
#   3. Skip "Install suggested plugins" (we already baked them in via plugins.txt).
#   4. Create your admin user.
# =============================================================================
services:
  jenkins:
    container_name: circleguard-jenkins
    build:
      context: .
      dockerfile: Dockerfile
    image: circleguard-jenkins:lts
    restart: unless-stopped
    ports:
      - "8080:8080"     # web UI
      - "50000:50000"   # JNLP port (only needed if you add remote agents)
    environment:
      # JVM tuning. -Xmx2g is plenty for a local controller running ~6 jobs.
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=true -Xmx2g"
      # Skip the noisy "you should secure your Jenkins" banner during local dev.
      JENKINS_OPTS: "--prefix=/"
    # On Docker Desktop / Windows the host's docker.sock is exposed inside the
    # container as "srw-rw---- root root" (GID 0). The "jenkins" user (uid 1000)
    # cannot access it without being in a group that matches the socket's GID.
    # Adding "0" (root) as a supplementary group is the smallest-change fix:
    # the process still runs as jenkins, it just gains read/write on root-owned
    # files INSIDE the container. The image's pre-baked "docker" group (GID
    # 1001) is kept as a fallback for Linux hosts where the socket has that GID.
    group_add:
      - "0"
    volumes:
      # Persist Jenkins home (jobs, build history, plugins) across restarts.
      - jenkins_home:/var/jenkins_home
      # CRITICAL: mount the host's Docker socket so Jenkins can build/run images
      # using the host daemon. This avoids the (more complex) Docker-in-Docker
      # setup. On Docker Desktop for Windows the named pipe is exposed via WSL2
      # at this same path inside Linux containers.
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount the CONTAINER-READY kubeconfig generated by setup-kubeconfig.ps1.
      # The original ~/.kube/config points to https://127.0.0.1:NNNNN, which is
      # the host's loopback -- unreachable from inside the container. The
      # generated copy rewrites that URL to host.docker.internal:NNNNN and adds
      # insecure-skip-tls-verify (the Docker Desktop API cert is signed only
      # for 127.0.0.1, so it can't be validated under the new hostname).
      # Run `pwsh ./infra/jenkins/setup-kubeconfig.ps1` once before `up -d`.
      - ./.kubeconfig-incontainer:/var/jenkins_home/.kube/config:ro

volumes:
  jenkins_home:
    name: circleguard_jenkins_home
