[changelog]
header = """
# CircleGuard — Release Notes\n
"""
body = """
{% if version %}\
## [{{ version }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}\
- {{ commit.message | upper_first }}{% if commit.breaking %} **(BREAKING)**{% endif %}\
  ({{ commit.id | truncate(length=7, end="") }}{% if commit.author.name %} — {{ commit.author.name }}{% endif %})
{% endfor %}\
{% endfor %}\n
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = false
commit_parsers = [
    { message = "^feat",    group = "Features" },
    { message = "^fix",     group = "Bug Fixes" },
    { message = "^perf",    group = "Performance" },
    { message = "^refactor",group = "Refactor" },
    { message = "^test",    group = "Tests" },
    { message = "^docs",    group = "Documentation" },
    { message = "^ci",      group = "CI / Build" },
    { message = "^build",   group = "CI / Build" },
    { message = "^chore",   group = "Chores" },
    { message = "^style",   group = "Style" },
    { message = "^revert",  group = "Reverts" },
    { message = ".*",       group = "Other" },
]
filter_commits = false
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "newest"
